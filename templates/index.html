<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Security & Access Control</title>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #000000; color: #d4d4d4; text-align: center; margin: 0; padding: 25px; }
        h1 { color: #f5f5f5; font-size: 20px; font-weight: 500; margin-bottom: 8px; letter-spacing: 1px; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; align-items: flex-start; }
        
        .video-wrapper { position: relative; width: 420px; height: 320px; border: 1px solid #262626; border-radius: 4px; background: #0a0a0a; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* تأثير مسح شبيه بالآيفون (Face ID Guide Overlay) */
        .face-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px; height: 200px;
            border: 2px dashed rgba(94, 234, 212, 0.5);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(13, 148, 136, 0.2);
            animation: pulse-guide 2s infinite;
        }
        @keyframes pulse-guide {
            0% { border-color: rgba(94, 234, 212, 0.3); }
            50% { border-color: rgba(94, 234, 212, 0.9); }
            100% { border-color: rgba(94, 234, 212, 0.3); }
        }

        .card { background: #0a0a0a; border: 1px solid #222222; padding: 20px; border-radius: 4px; width: 450px; text-align: left; max-height: 580px; overflow-y: auto; }
        button { background: #171717; color: #e5e5e5; border: 1px solid #333333; padding: 9px 16px; font-size: 13px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: 500; font-family: inherit; transition: all 0.15s ease; }
        button:hover { background: #262626; border-color: #525252; }
        .btn-toggle { background: #171717; border: 1px solid #333333; color: #a3a3a3; }
        .btn-toggle.active { background: #042f2e; border-color: #0d9488; color: #5eead4; }
        input { width: 100%; padding: 7px 10px; margin: 4px 0 10px 0; border-radius: 4px; border: 1px solid #262626; background: #121212; color: #f5f5f5; box-sizing: border-box; font-size: 12px; font-family: inherit; }
        label { font-size: 11px; color: #737373; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .success { color: #4ade80; font-weight: 600; }
        .alert { color: #f87171; font-weight: 600; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .form-full { grid-column: span 2; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 3px; font-size: 11px; font-weight: 500; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; font-family: inherit; }
        .badge-active { background: #022c22; color: #34d399; border: 1px solid #065f46; }
        .badge-standby { background: #171717; color: #737373; border: 1px solid #262626; }
    </style>
</head>
<body>

    <h1>Enterprise Security & Access Control System</h1>
    <div>
        <span id="scanStatus" class="status-badge badge-standby">System Standby (Manual Mode)</span>
    </div>
    
    <div class="container">
        <div>
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline></video>
                <div class="face-guide"></div>
            </div>
            <button onclick="captureAndVerify()">Capture & Verify / Scan</button>
            <button id="toggleAutoBtn" class="btn-toggle" onclick="toggleAutoScan()">Enable Auto-Scan</button>
        </div>
        
        <div class="card" id="cardBox">
            <h3 style="margin-top:0; border-bottom:1px solid #222222; padding-bottom:8px; font-size:14px; color:#f5f5f5; font-weight:500;">Security Telemetry Panel</h3>
            <div id="result">
                <p class="alert" style="color: #525252;">Align face within guide and initiate biometric scan...</p>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        let autoScanInterval = null;
        let isScanning = false;

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Camera access error: " + err); });

        function toggleAutoScan() {
            const btn = document.getElementById('toggleAutoBtn');
            const statusBadge = document.getElementById('scanStatus');

            if (!isScanning) {
                isScanning = true;
                btn.textContent = "Disable Auto-Scan";
                btn.classList.add('active');
                statusBadge.textContent = "Active Live Surveillance (Polling every 2s)";
                statusBadge.className = "status-badge badge-active";

                autoScanInterval = setInterval(() => {
                    executeVerification(true);
                }, 2000);
            } else {
                isScanning = false;
                btn.textContent = "Enable Auto-Scan";
                btn.classList.remove('active');
                statusBadge.textContent = "System Standby (Manual Mode)";
                statusBadge.className = "status-badge badge-standby";

                clearInterval(autoScanInterval);
            }
        }

        function captureAndVerify() {
            executeVerification(false);
        }

        function executeVerification(isBackground = false) {
            if (video.videoWidth === 0 || video.videoHeight === 0) return;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('image', blob, 'snapshot.jpg');

                if (!isBackground) {
                    document.getElementById('result').innerHTML = "<p style='color:#737373;'>Scanning face template & verifying liveness...</p>";
                }

                fetch('/api/verify', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    let resDiv = document.getElementById('result');
                    let cardBox = document.getElementById('cardBox');
                    
                    if(data.status === 'success') {
                        let p = data.profile;
                        let fam = p.family_info || {};
                        resDiv.innerHTML = `
                            <p class="success">Access Granted [Score: ${data.score.toFixed(2)}]</p>
                            <p style="margin:5px 0;"><b>Full Name:</b> ${p.full_name}</p>
                            <p style="margin:5px 0;"><b>ID Number:</b> ${p.id_number}</p>
                            <p style="margin:5px 0;"><b>Phone:</b> ${p.phone_number}</p>
                            <p style="margin:5px 0;"><b>Major:</b> ${p.major}</p>
                            <p style="margin:5px 0;"><b>Institution:</b> ${p.institution}</p>
                            <p style="margin:5px 0;"><b>Location:</b> ${p.location}</p>
                            <p style="margin:5px 0;"><b>Father Status:</b> ${fam.father_status} (Age: ${fam.father_age})</p>
                            <p style="margin:5px 0;"><b>Mother Status:</b> ${fam.mother_status} (Age: ${fam.mother_age})</p>
                            <p style="margin:5px 0;"><b>Clearance:</b> ${p.clearance_level}</p>
                        `;
                    } else if(data.status === 'intruder') {
                        if (isScanning && isBackground) {
                            toggleAutoScan();
                        }

                        resDiv.innerHTML = `
                            <p class="alert">Security Alert: Unauthorized Entity / Face Locked [Score: ${data.score.toFixed(2)}]</p>
                            <p style="font-size: 11px; color: #737373; margin-bottom: 8px;">${data.message}</p>
                            <hr style="border-color: #222222; margin: 8px 0;">
                            <h4 style="margin: 6px 0; color: #f5f5f5; font-size: 12px; text-transform: uppercase;">Enroll New User Profile (Face Captured)</h4>
                            <form id="regForm" onsubmit="submitRegistration(event)">
                                <div class="form-grid">
                                    <div class="form-full">
                                        <label>Username (Key):</label>
                                        <input type="text" name="key_name" required>
                                    </div>
                                    <div>
                                        <label>Full Name:</label>
                                        <input type="text" name="full_name" required>
                                    </div>
                                    <div>
                                        <label>ID Number:</label>
                                        <input type="text" name="id_number" required>
                                    </div>
                                    <div>
                                        <label>Phone Number:</label>
                                        <input type="text" name="phone_number" required>
                                    </div>
                                    <div>
                                        <label>Academic Major:</label>
                                        <input type="text" name="major" required>
                                    </div>
                                    <div>
                                        <label>Institution:</label>
                                        <input type="text" name="institution" required>
                                    </div>
                                    <div>
                                        <label>Location:</label>
                                        <input type="text" name="location" required>
                                    </div>
                                    <div class="form-full">
                                        <label>Education Path:</label>
                                        <input type="text" name="education_path" required>
                                    </div>
                                    <div>
                                        <label>Father Status:</label>
                                        <input type="text" name="f_status">
                                    </div>
                                    <div>
                                        <label>Father Age:</label>
                                        <input type="text" name="f_age">
                                    </div>
                                    <div>
                                        <label>Father Occupation:</label>
                                        <input type="text" name="f_occ">
                                    </div>
                                    <div>
                                        <label>Mother Status:</label>
                                        <input type="text" name="m_status">
                                    </div>
                                    <div>
                                        <label>Mother Age:</label>
                                        <input type="text" name="m_age">
                                    </div>
                                    <div>
                                        <label>Mother Occupation:</label>
                                        <input type="text" name="m_occ">
                                    </div>
                                    <div class="form-full">
                                        <label>Technical Profile:</label>
                                        <input type="text" name="tech_profile">
                                    </div>
                                    <div class="form-full">
                                        <label>Clearance Level:</label>
                                        <input type="text" name="clearance" value="User" required>
                                    </div>
                                </div>
                                <button type="submit" style="width:100%; background:#171717; border: 1px solid #333; margin-top:8px;">Commit Profile & Face</button>
                            </form>
                        `;
                        cardBox.scrollTop = cardBox.scrollHeight;
                    } else if(data.status === 'error') {
                        resDiv.innerHTML = `<p class="alert">System Error: ${data.message}</p>`;
                    }
                });
            }, 'image/jpeg');
        }

        function submitRegistration(event) {
            event.preventDefault();
            const formElement = document.getElementById('regForm');
            const formData = new FormData(formElement);

            fetch('/api/register', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('result').innerHTML = `<p class="success" style="text-align:center; padding: 20px;">Profile and Biometric Template successfully committed to database.</p>`;
                } else {
                    alert("Registration error: " + data.message);
                }
            });
        }
    </script>
</body>
</html>
